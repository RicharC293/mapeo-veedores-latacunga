<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recintos electorales de Latacunga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#14283D; --muted:#5A6B7D; --line:#C9D3DD;
  --urb:#BCD3EA; --rur:#DCE6D6; --edge:#FFFFFF; --sel:#1F4E78; --dim:.35;
  --base:#CDDCE3; --pin:#F2B632; --pin-edge:#14283D; --chip:#E6EDF4; --focus:#2E75B6;
  --font:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A26; --panel:#142332; --ink:#E4ECF3; --muted:#93A5B7; --line:#2C3F52;
    --urb:#2A4B6E; --rur:#2B3F33; --edge:#0E1A26; --sel:#7DB3E6; --dim:.3;
    --base:#2A4550; --pin:#F2B632; --pin-edge:#0E1A26; --chip:#1C3043; --focus:#7DB3E6;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A26; --panel:#142332; --ink:#E4ECF3; --muted:#93A5B7; --line:#2C3F52;
  --urb:#2A4B6E; --rur:#2B3F33; --edge:#0E1A26; --sel:#7DB3E6; --dim:.3;
  --base:#2A4550; --pin:#F2B632; --pin-edge:#0E1A26; --chip:#1C3043; --focus:#7DB3E6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr 400px;height:100%;min-height:0}
.mapwrap{position:relative;min-height:0;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}

.head{position:absolute;left:12px;top:10px;max-width:calc(100% - 90px);pointer-events:none;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--bg) 82%,transparent)}
.head h1{margin:0;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.1;letter-spacing:-.01em;max-width:16ch}
.head p{margin:.4rem 0 0;color:var(--muted);font-size:.95rem;max-width:40ch}

.ctrls{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.ctrls button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.2rem;display:grid;place-items:center}
.ctrls button:hover{border-color:var(--sel)}

.legend{position:absolute;left:20px;bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.8rem;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pin);border:2px solid var(--pin-edge);display:inline-block}

.base{fill:var(--base);stroke:none}
.parish{stroke:var(--edge);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .2s}
.parish.urb{fill:var(--urb)} .parish.rur{fill:var(--rur)}
.parish:hover{filter:brightness(.94)}
.dimmed .base{fill:color-mix(in srgb,var(--base) 40%,var(--bg))}
.dimmed .parish.urb:not(.on){fill:color-mix(in srgb,var(--urb) 40%,var(--bg))}
.dimmed .parish.rur:not(.on){fill:color-mix(in srgb,var(--rur) 40%,var(--bg))}
.dimmed .parish:not(.on){stroke:color-mix(in srgb,var(--edge) 40%,var(--bg))}
.outline{fill:none;stroke:var(--sel);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.plabel{fill:var(--ink);font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.plabel.u{display:none}
.zoomed .plabel.u{display:block}
.rec{fill:var(--pin);stroke:var(--pin-edge);cursor:pointer;vector-effect:non-scaling-stroke;stroke-width:1.5}
.rec:hover,.rec.on{fill:var(--sel);stroke:var(--pin)}
.rec.on{stroke-width:3}
.dimmed .rec{opacity:.3}
.dimmed .rec.inpar{opacity:1}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.pin-top{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.body{padding:8px 20px 28px}
.back{background:none;border:0;padding:6px 0;color:var(--sel);font-weight:700;cursor:pointer;font-size:.95rem}
h2{font-size:1.45rem;line-height:1.2;margin:.3rem 0 .2rem}
h3{font-size:1rem;margin:1.4rem 0 .4rem;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:0 0 .6rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--chip);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.25rem;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.row{width:100%;text-align:left;background:none;border:0;padding:12px 4px;display:flex;gap:12px;align-items:center;cursor:pointer}
.row:hover{background:var(--chip)}
.row .t{flex:1;min-width:0}
.row .t strong{display:block;font-weight:700;line-height:1.25}
.row .t small{color:var(--muted);font-size:.84rem}
.row .n{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .n small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--sel);margin-left:4px;vertical-align:1px}
dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
dt{color:var(--muted);font-size:.88rem}
dd{margin:0;font-weight:700}
.juntas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.juntas div{border:1px solid var(--line);border-radius:10px;padding:10px}
.juntas b{font-size:1.4rem;display:block;line-height:1.1}
.juntas small{color:var(--muted)}
.go{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:10px;background:var(--sel);color:var(--panel);text-decoration:none;font-weight:700}
.empty{color:var(--muted);padding:12px 0}
.foot{margin-top:24px;color:var(--muted);font-size:.8rem}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:58svh auto;height:auto}
  .mapwrap{height:58svh}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .pin-top{position:static}
  .head{left:6px;top:6px}
  .head p{font-size:.85rem}
  .legend{left:10px;bottom:10px;font-size:.74rem;gap:10px;padding:8px 10px}
  .ctrls{right:10px;top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Mapa de parroquias y recintos electorales del cantón Latacunga"></svg>
    <div class="head">
      <h1>Recintos electorales de Latacunga</h1>
      <p id="resumen"></p>
    </div>
    <div class="ctrls">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zreset" aria-label="Ver todo el cantón">⤢</button>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i class="sw" style="background:var(--urb)"></i>Urbana</span>
      <span><i class="sw" style="background:var(--rur)"></i>Rural</span>
      <span><i class="dot"></i>Recinto (tamaño según electores)</span>
    </div>
  </div>
  <aside class="panel" aria-live="polite">
    <div class="pin-top">
      <input id="q" class="search" type="search" placeholder="Buscar recinto o dirección" aria-label="Buscar recinto o dirección">
    </div>
    <div class="body" id="body"></div>
  </aside>
</div>

  proj.fitExtent([[pad,top],[W-pad,H-60]],PARR);
  gBase.attr('d',path(BASE));
  gPar.selectAll('path').attr('d',path);
  gOut.selectAll('path').attr('d',path);
  gLab.selectAll('text').attr('x',d=>proj([d.properties.lx,d.properties.ly])[0]).attr('y',d=>proj([d.properties.lx,d.properties.ly])[1]);
  gRec.selectAll('circle').attr('cx',d=>proj([d.lon,d.lat])[0]).attr('cy',d=>proj([d.lon,d.lat])[1]);
}

gPar.selectAll('path').data(PARR.features).join('path')
  .attr('class',d=>'parish '+(d.properties.urbana?'urb':'rur'))
  .on('click',(e,d)=>{e.stopPropagation();showParish(d.properties.code,true)})
  .append('title').text(d=>d.properties.name);
gLab.selectAll('text').data(PARR.features).join('text')
  .attr('class',d=>'plabel'+(d.properties.urbana?' u':''))
  .text(d=>d.properties.name.replace(/ \(.*\)/,''));
const sorted = [...RECS].sort((a,b)=>b.el-a.el);
gRec.selectAll('circle').data(sorted,d=>d.cod).join('circle')
  .attr('class','rec')
  .on('click',(e,d)=>{e.stopPropagation();showRecinto(d.cod,true)})
  .append('title').text(d=>title(d.nombre));

layout();
zoom.transform(svg,d3.zoomIdentity);
new ResizeObserver(()=>{layout();}).observe(wrap);

function zoomTo(feature){
  const [[x0,y0],[x1,y1]] = path.bounds(feature);
  const top = W<820?138:110;
  const s = Math.min(40, 0.85/Math.max((x1-x0)/W,(y1-y0)/(H-top)));
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const t = d3.zoomIdentity.translate(W/2, top+(H-top)/2).scale(s).translate(-cx,-cy);
  svg.transition().duration(matchMedia('(prefers-reduced-motion:reduce)').matches?0:650).call(zoom.transform,t);
}
function zoomPoint(r){
  const [x,y]=proj([r.lon,r.lat]); const s=Math.max(k,14);
  const top = W<820?138:110;
  svg.transition().duration(matchMedia('(prefers-reduced-motion:reduce)').matches?0:650)
    .call(zoom.transform,d3.zoomIdentity.translate(W/2,top+(H-top)/2).scale(s).translate(-x,-y));
}
function highlight(code,cod){
  svg.classed('dimmed',code!=null);
  gPar.selectAll('path').classed('on',d=>d.properties.code===code);
  gRec.selectAll('circle').classed('inpar',d=>d.par===code).classed('on',d=>d.cod===cod);
  gOut.selectAll('path').data(code!=null?[parByCode.get(code)]:[]).join('path').attr('class','outline').attr('d',path);
  if(cod!=null) gRec.selectAll('circle').filter(d=>d.cod===cod).raise();
}
d3.select('#zin').on('click',()=>svg.transition().call(zoom.scaleBy,1.6));
d3.select('#zout').on('click',()=>svg.transition().call(zoom.scaleBy,1/1.6));
d3.select('#zreset').on('click',()=>showCanton(true));

/* ---------- panel ---------- */
const body = document.getElementById('body');
const q = document.getElementById('q');
const scrollPanel = ()=>{ if(W<820) document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}); };

function parRow(f){
  const s=stats[f.properties.code];
  return `<li><button class="row" data-par="${f.properties.code}"><span class="t"><strong>${esc(f.properties.name)}</strong><small>${s.rec} ${s.rec===1?'recinto':'recintos'}, ${s.jt} juntas</small></span><span class="n">${fmt(s.el)}<small>electores</small></span></button></li>`;
}
function recRow(r,showPar){
  const p=parByCode.get(r.par).properties.name.replace(/ \(.*\)/,'');
  return `<li><button class="row" data-rec="${r.cod}"><span class="t"><strong>${esc(title(r.nombre))}${r.cda?'<span class="tag">CDA</span>':''}</strong><small>${showPar?esc(p)+', ':''}${esc(title(r.dir))}</small></span><span class="n">${r.jt}<small>juntas</small></span></button></li>`;
}
function bindRows(){
  body.querySelectorAll('[data-par]').forEach(b=>b.onclick=()=>showParish(+b.dataset.par,true));
  body.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>showRecinto(+b.dataset.rec,true));
  body.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{const v=b.dataset.back; v==='canton'?showCanton(true):showParish(+v,true)});
}

function showCanton(move){
  highlight(null,null);
  if(move) svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);
  const byType = u => PARR.features.filter(f=>f.properties.urbana===u).sort((a,b)=>stats[b.properties.code].el-stats[a.properties.code].el);
  body.innerHTML = `
    <h2>Cantón Latacunga</h2>
    <p class="sub">Toca una parroquia en el mapa o en la lista para ver sus recintos.</p>
    <div class="stats">
      <div class="stat"><b>${RECS.length}</b><small>recintos</small></div>
      <div class="stat"><b>${fmt(T.el)}</b><small>electores</small></div>
      <div class="stat"><b>${T.jt}</b><small>juntas (${T.jf} F, ${T.jm} M)</small></div>
    </div>
    <h3>Parroquias urbanas</h3><ul class="list">${byType(true).map(parRow).join('')}</ul>
    <h3>Parroquias rurales</h3><ul class="list">${byType(false).map(parRow).join('')}</ul>
    <p class="foot">Fuente: distributivo de recintos del CNE, corte al 11 de agosto de 2026 (Elecciones Seccionales y CPCCS 2027). Los límites parroquiales son aproximados.</p>`;
  bindRows();
}
function showParish(code,move){
  const f=parByCode.get(code), s=stats[code];
  highlight(code,null);
  if(move) zoomTo(f);
  const recs=RECS.filter(r=>r.par===code).sort((a,b)=>b.el-a.el);
  body.innerHTML = `
    <button class="back" data-back="canton">‹ Todo el cantón</button>
    <h2>${esc(f.properties.name)}</h2>
    <p class="sub">Parroquia ${f.properties.urbana?'urbana':'rural'}</p>
    <div class="stats">
      <div class="stat"><b>${s.rec}</b><small>${s.rec===1?'recinto':'recintos'}</small></div>
      <div class="stat"><b>${fmt(s.el)}</b><small>electores</small></div>
      <div class="stat"><b>${s.jt}</b><small>juntas (${s.jf} F, ${s.jm} M)</small></div>
    </div>
    <h3>Recintos</h3><ul class="list">${recs.map(r=>recRow(r,false)).join('')}</ul>`;
  bindRows();
  if(move) scrollPanel();
}
function rango(a,b){return a===b?`Junta ${a}`:`Juntas ${a} a ${b}`}
function showRecinto(cod,move){
  const r=RECS.find(x=>x.cod===cod), f=parByCode.get(r.par);
  highlight(r.par,cod);
  if(move) zoomPoint(r);
  const maps=`https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`;
  body.innerHTML = `
    <button class="back" data-back="${r.par}">‹ ${esc(f.properties.name.replace(/ \(.*\)/,''))}</button>
    <h2>${esc(title(r.nombre))}</h2>
    <p class="sub">${esc(title(r.dir))}</p>
    <div class="juntas">
      <div><b>${r.jf}</b><small>femeninas<br>${r.jf?rango(r.fi,r.ff):'Sin juntas'}</small></div>
      <div><b>${r.jm}</b><small>masculinas<br>${r.jm?rango(r.mi,r.mf):'Sin juntas'}</small></div>
    </div>
    <dl>
      <dt>Electores</dt><dd>${fmt(r.el)}</dd>
      <dt>Total de juntas</dt><dd>${r.jt}</dd>
      <dt>Parroquia</dt><dd>${esc(f.properties.name)}</dd>
      ${r.zona?`<dt>Zona electoral</dt><dd>${esc(title(r.zona))}</dd>`:''}
      <dt>Código CNE</dt><dd>${r.cod}</dd>
      <dt>Teléfono</dt><dd>${r.tel?`<a href="tel:${r.tel}" style="color:inherit">${r.tel}</a>`:'No registrado'}</dd>
      <dt>Democracia accesible (CDA)</dt><dd>${r.cda?'Sí':'No'}</dd>
      <dt>Difícil acceso</dt><dd>${r.dif?'Sí':'No'}</dd>
      <dt>Sin conectividad</dt><dd>${r.sinc?'Sí':'No'}</dd>
    </dl>
    <a class="go" href="${maps}" target="_blank" rel="noopener">Cómo llegar en Google Maps</a>`;
  bindRows();
  if(move) scrollPanel();
}

q.addEventListener('input',()=>{
  const t=q.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(!t){showCanton(false);return}
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const hits=RECS.filter(r=>norm(r.nombre+' '+r.dir+' '+r.cod).includes(t));
  highlight(null,null);
  body.innerHTML=`<h3>${hits.length} ${hits.length===1?'resultado':'resultados'}</h3>`+
    (hits.length?`<ul class="list">${hits.map(r=>recRow(r,true)).join('')}</ul>`:`<p class="empty">No hay recintos con ese nombre o dirección. Prueba con otra palabra, por ejemplo el nombre de la escuela o la calle.</p>`);
  bindRows();
});
svg.on('click',()=>{});
showCanton(false);
</script>
</body>
</html>
